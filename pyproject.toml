[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autonomous-data-engineering-platform"
version = "1.0.0"
description = "Multi-agent (LangGraph) pipeline monitoring for Azure Databricks, with an offline demo mode"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pradeep Kumar Yenni" }]
requires-python = ">=3.11"
# Keep in sync with requirements.txt (used by CI and the Dockerfile)
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "langgraph==0.2.28",
    "langchain-core==0.3.86",
    "langchain-openai==0.2.1",
    "httpx==0.27.2",
    "pandas==2.2.3",
    "numpy==2.1.1",
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
    "prometheus-client==0.21.0",
    "tenacity==9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
